<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>baf-dsh</title>
  <link rel="stylesheet" href="splash.css" />
</head>
<body>
  <div class="shell">
    <div class="panel">
      <!-- 【变更】2026-10-23 (批次十八 1.2): the version moved BACK to the
           panel's BOTTOM-LEFT corner (the footer keeps only the credit). -->
      <p id="version" class="version" aria-label="应用版本"></p>
      <div class="main">
        <div class="logos" aria-hidden="true">
          <!--
            Auto-spinning two-ring mark. Mirrors packages/client/ui-baf-desktop/
            src/client/HeroTrailingMark.tsx, but without a hover trigger — the
            splash is a 380x300 frameless surface, hover rarely applies, so the
            lobes turn from the moment the window appears (still gated on
            prefers-reduced-motion in splash.css).
          -->
          <svg
            class="logo logo-sora"
            viewBox="0 0 942 942"
            xmlns="http://www.w3.org/2000/svg"
          >
            <defs>
              <clipPath id="baf-splash-mark-lower-left">
                <circle cx="275.5" cy="666" r="278" />
              </clipPath>
              <clipPath id="baf-splash-mark-upper-right">
                <circle cx="665.5" cy="276" r="278" />
              </clipPath>
            </defs>
            <g class="spinCw" style="transform-origin: 275.5px 666px;">
              <g clip-path="url(#baf-splash-mark-lower-left)">
                <image href="sora.png" x="0" y="0" width="942" height="942" />
              </g>
            </g>
            <g class="spinCcw" style="transform-origin: 665.5px 276px;">
              <g clip-path="url(#baf-splash-mark-upper-right)">
                <image href="sora.png" x="0" y="0" width="942" height="942" />
              </g>
            </g>
          </svg>
        </div>
        <h1 class="brand">BAF DSH</h1>
        <p id="status">正在启动服务…</p>
        <div class="bar" aria-hidden="true"><i></i></div>
      </div>
      <!--
        【变更】2026-10-22 (批次十五 1): the slow-launch escape hatch. After 5s
        on the splash the copy explains the wait and 后台启动 hides the splash
        so the boot finishes in the tray (the main window shows itself when
        the backend is ready; splash.js wires the button to the splash:bg-start
        IPC through preload-splash).
        【变更】2026-10-23 (批次十七 1): the separate band is GONE — the hint
        joins the rotating status line (splash.js inserts it into the statuses
        array so it reads like 正在检查更新…, no layout shift ever), and the
        button stands ALONE pinned to the panel's bottom-left corner.
        【变更】2026-10-23 (批次十八 1.3/1.4): the button moves to the panel's
        TOP-RIGHT corner and grows a down-arrow glyph (「启动转入后台」); it
        reveals in the same frame as the hint sentence, never ahead of it.
      -->
      <button id="bgStart" class="bgStart" type="button">
        <svg class="bgStartIcon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M8 1.75v6.25" />
          <path d="M4.75 5.25 8 8.5l3.25-3.25" />
          <path d="M2.75 13.25h10.5" />
        </svg>
        <span>后台启动</span>
      </button>
      <div class="footer">
        <p class="credit">by sora</p>
      </div>
    </div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
