# The `baf` agent preset: enterprise controlled coding agent (BAF mode).
#
# Copied from `standard` (dsh has no preset inheritance). Same agent-plane
# rules apply: mount once under a standing scope; host keeps registries,
# sandbox, approval, persistence, and the model route. Service rows that
# publish must sit inside a `cordis:group` with an `isolate` realm.
#
# BAF go workflow state is owned by domain services (Phase 2+), not by the
# dsh `tool-workflow` / `ralph` rows retained below for optional implement-
# stage fan-out. Those tools must never drive stage transitions.
#
# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
# Schema note: dsh-persona takes `prefix` (required) + `suffix` (optional);
# the legacy `text` field no longer exists — a `text`-only row fails to mount
# with `$.prefix missing required value`.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: 你的工作目录是 {{cwd}}。Your working directory is {{cwd}}.
    prefix: >-
      你是 BAF 企业编码 Agent，由 {{model}} 模型驱动。

      你遵循 go 工作流：intake 分类 → open → clarify → design → plan → implement → verify → archive。

      阶段转换由 domain service（WorkflowService.transition）决定；你不能自行跳过阶段、宣称完成、或把自然语言当作转换证据。

      分类确认前不得修改源码；实现阶段只修改 allowlist 内文件；验证与归档条件由机器门禁结果决定，而不是由你的声明决定。

      每个回合开始时，先用文件工具读 .baf/projection/index.json 和 openspec/changes/<变更>/ 下的产物，判断当前阶段与未完成的工作：仍是 TODO 模板的阶段产物就是你的首要任务（按 gates 的完成条件填写）。系统不会向你注入消息或代替客户发言——唯一例外是客户手敲 /baf-go 时系统派来的只读「【BAF 工单 · /baf-go 派单】」条目：那是客户授权的工作单，按它列出的「缺什么」逐项补齐即可，它不是你自己的话、也不是客户的原话。产物完成后直接结束回合，下一阶段的确认卡由系统在回合结束时弹出。写产物分节进行：先写文件骨架，再用多次小段编辑补齐各节。需要客户决策时必须调用 baf_question_ask 弹卡提问。

      会话里已有进行中的变更时，客户的每句话默认都围绕当前变更：补充信息、追问、微调要求，一律直接当作当前变更的输入处理并继续工作，不要询问「是否新开一条工作流」。只有当新输入与当前变更的目标明显是两件不同的事时，才调用 baf_gate_ask（requirement=客户原话）弹卡让客户决定去向；客户明确要另开工作流时，请他新建一个会话（或新工作区）再提出该需求——同一工作区同时只承载一条进行中的变更。

      状态汇报格式（回合结束和每次阶段切换时刻，严格用同一个四行骨架，信息要具体、不要空话）：
      【阶段】<阶段名>（<状态变化>，如 计划（进行中 → 已完成））
      【本回合做了什么】<一两句：完成了什么、依据了哪些真实文件/命令结果>
      【产物】<文件> 已填写（<关键数字：任务数、白名单文件数、检查项数等>）
      【下一步】<等待客户在确认卡点选「…」/ 系统将自动运行验证 / 我将继续完成某任务>


      You are the BAF enterprise coding agent, powered by the {{model}} model.

      Follow the go workflow: intake classification → open → clarify → design → plan → implement → verify → archive.

      Stage transitions are decided only by the domain service (WorkflowService.transition); you must not skip stages, claim completion, or treat natural language as transition evidence.

      Do not modify source before intake confirmation; in implement, only edit files on the allowlist; verify and archive readiness come from machine gates, not from your claims.

      At the start of every turn, read .baf/projection/index.json and the openspec/changes/<change>/ artifacts with your file tools to learn the current stage and the unfinished work: a stage artifact that is still the TODO template is your first task (fill it to the gate's completion conditions). The system never injects messages for you or speaks for the customer — the one exception is the read-only 「【BAF 工单 · /baf-go 派单】」 work order the system delivers when the customer types /baf-go: that is the customer's authorized order, so fill the items it lists under 缺什么; it is not your own words and not a transcript of the customer's. When an artifact is done, simply end your turn — the system checks it at turn end and pops the next stage card. Author artifacts in sections: write the skeleton first, then fill each section with small edits. Customer decisions go through baf_question_ask popup cards, never prose questions.

      While a change is running in this session, EVERY customer message is presumed to be about that change by default: supplements, follow-up questions, and small adjustments are handled as input to the current change — never ask "should we start a new workflow?". Only when a message is clearly about a DIFFERENT piece of work do you call baf_gate_ask (requirement=<the customer's words>) so the customer settles the collision on a card; if the customer truly wants a separate workflow, direct them to a NEW session (or another workspace) for it — one workspace carries one active change at a time.

      Status report format (at every turn end and stage transition, strictly the same four-line skeleton, concrete not vague):
      【阶段】<stage>（<status change>, e.g. 计划（进行中 → 已完成））
      【本回合做了什么】<one or two sentences: what got done, which real files/command outputs it relied on>
      【产物】<file> filled（<key numbers: task count, allowlist size, check count>）
      【下一步】<awaiting the customer's click on 「…」 / the system will run verification / you will continue task X>

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# BAF skills travel with this preset directory (`skills/`), resolved from the
# composition `baseUrl` the same way Creator mode ships its authoring skills.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# baf-scaffold service row. MUST sit INSIDE the baf-domain isolate: a preset
# row outside an `isolate` realm publishes its service process-global, which
# agent-presets' mount invariant rejects outright ("row(s) published
# process-global service(s) [bafScaffold]") — and a rejected mount kills every
# baf session (new-session / workspace selection fail with agent-preset/invalid).
# Host-plane consumers (`/baf-scaffold` handler, the workflow Tab Remote) must
# therefore resolve the service through the receiving agent's `agent.ctx`
# (entry-local isolate realm), the same pattern `probeMountFlags` already uses
# for bafGuard / bafQuality. The service itself is stateless (writes workspace
# files by cwd), so one isolate instance per agent is exactly right.

# Slash commands must sit outside the baf-domain isolate (same pattern as
# command-goal): they register into the host `commands` service for this
# standing mount. Handlers read the file-backed projection store by cwd.
#
# 2026-09-22 (customer decision, workspace demo_1): `/baf-go` also DISPATCHES.
# At every rest where the next move is the model authoring an artifact, typing
# the command queues a work order into this session's next-turn inbox
# (`agent.followup`) so the flow continues instead of resting silently. The
# order is `source.kind: 'baf-workflow'` + `form: 'go-dispatch'` — the chat client
# renders it as a read-only context row, never a customer bubble, and it is
# sent ONLY from the customer's own typed command (never from the orchestrator,
# the Tab, or a model tool). That is the distinction the baf-session-gate note
# below draws: this is not the host speaking for the customer, it is the
# customer's command speaking, attributed to this plugin.
- id: baf-commands
  name: '@deepseek-ai/dsh-baf-workflow/commands'

# Phase 8.8 session gate (§18.3). Fires ONCE per agent, right after the agent
# exists: it probes the toolchain, binds/echoes the unfinished-workflow state,
# and prints the welcome card — which is also the BAF-mode greeting
# (requirement 6). It sits outside the baf-domain isolate like the two rows
# around it, because it needs BOTH host-plane registries: `agents` (per-agent
# install + agent/created) and `commands` (the card is delivered by executing
# `/baf-welcome`, the only path that puts a card in the transcript before the
# first model turn — a `system/message` would need an open turn, and a
# synthetic `user/message` would put words in the customer's mouth).
#
# Ordered AFTER baf-commands on purpose: the gate executes `/baf-welcome`, so
# the registration must already be in the registry when the first agent is
# created. It degrades to a log line if the command is absent — a broken
# workspace must still open a session (§17.7 R19).
- id: baf-session-gate
  name: '@deepseek-ai/dsh-baf-workflow/session-gate'

# Phase 8.2: standalone CLI mirror of /baf-* slash commands. Disabled by
# default so ordinary `baf` agent sessions do NOT pull this row (an idle
# `cmdlineArgs` consumer that waits for argv is harmless but wasteful). The
# shipped `overlays/baf-cli.cordis.patch.yml` re-enables it for the
# `baf-cli` profile path. Sits outside the isolate for the same reason as
# baf-commands: `cmdlineArgs` / `appExit` are host-provided and reading them
# from a preset realm would block every agent that mounts this preset.
- id: baf-cli
  disabled: true
  name: '@deepseek-ai/dsh-baf-workflow/cmdline'

# Per-agent tool guard install row. Like baf-commands, this sits outside the
# baf-domain isolate: it reaches the host `agents` service so each new agent
# gets a workspace-bound ToolGuard installed (entry workspace decided by
# agent.session.header.cwd).
- id: baf-guard-install
  name: '@deepseek-ai/dsh-baf-guard/install'

# Phase 8.12 + §22.17: model-facing `baf_gate_ask` tool. Sits outside the
# baf-domain isolate like baf-commands / baf-session-gate because the
# `tools` registry is a host-plane service (same pattern as `tool-bash` /
# `tool-fs` above). The tool renders the §22 card from the registry and,
# when a `userQuestions` answerer is mounted (the `tool-ask-user` row above
# publishes it), pops the §22.17 interactive dialog — the customer's click
# resolves through `driveGateResolve` (P0 registry + unknown_gate refusal),
# exactly like a Tab button. Without an answerer it degrades to card text
# only, so a missing tool or service is a soft degradation, not a
# session-opener failure (§17.7 R19).
- id: baf-gate-ask
  name: '@deepseek-ai/dsh-baf-workflow/gate-ask'

# 2026-09-21 standing rule (session 6.jsonl): every customer choice — not just
# workflow-path decisions — pops as a clickable card. `baf_question_ask` is the
# non-workflow half of that pair (content tradeoffs, scope preferences,
# mid-stage artifact questions); `baf_gate_ask` keeps the registry decisions.
# Host-plane row like baf-gate-ask (the `tools` registry), degrading to a
# verbatim question card when no `userQuestions` answerer is mounted (§17.7
# R19).
- id: baf-question-ask
  name: '@deepseek-ai/dsh-baf-workflow/question-ask'

# §22.17 J: state-driven auto-pop. Host-plane listener on `session/event` —
# when a genuine user message lands in an initialized, idle workspace, it
# pops the 「作为新需求开始？」 pre-question; only the customer's click mints
# a change and pops the classification dialog. This moves the popup trigger
# off the model's good behavior (rules are soft) and onto the platform. Sits
# outside the baf-domain isolate because `agents` / `userQuestions` are
# host-plane services; every failure degrades to a log line (§17.7 R19).
- id: baf-auto-pop
  name: '@deepseek-ai/dsh-baf-workflow/auto-pop'

# §22.19 harness-owned workflow line (session 7.jsonl user principle): after
# every COMPLETED model turn this row re-derives the change's resting point
# and pops the due gate — scaffold / bind-workflow / intake-classify / the
# advance family / design-confirm / verify-archive / resume. Workflow
# control (when to pop, when to wait, when to advance) is standard harness
# code the model cannot manipulate or skip; the model only authors business
# content. Pops ride the same single-flight ask queue as the coordinator /
# baf_gate_ask / auto-pop, so concurrent same-key pops collapse to a
# duplicate drop instead of covering each other. Sits outside the baf-domain
# isolate like baf-auto-pop (host-plane `agents` / `userQuestions`).
- id: baf-orchestrator
  name: '@deepseek-ai/dsh-baf-workflow/orchestrator'

# ── BAF domain（entry-local realm；桌面/CLI 经 session projection 读取状态）──
- id: baf-domain
  name: cordis:group
  group: true
  isolate:
    bafCore: true
    bafWorkflow: true
    bafOpenspec: true
    bafStandard: true
    bafQuality: true
    bafGuard: true
    bafScaffold: true
  config:
    - id: baf-core
      name: '@deepseek-ai/dsh-baf-core'
    - id: baf-workflow
      name: '@deepseek-ai/dsh-baf-workflow'
# Phase 5 起启用（OpenSpecAdapter 本地文件模式）：
    - id: baf-openspec
      name: '@deepseek-ai/dsh-baf-openspec'
# Phase 7+ 启用：
    - id: baf-standard
      name: '@deepseek-ai/dsh-baf-standard'
    - id: baf-quality
      name: '@deepseek-ai/dsh-baf-quality'
    - id: baf-guard
      name: '@deepseek-ai/dsh-baf-guard'
    - id: baf-scaffold
      name: '@deepseek-ai/dsh-baf-scaffold'
