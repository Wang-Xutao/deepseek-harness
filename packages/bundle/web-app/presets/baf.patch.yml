# Agent preset baf: one `@deepseek-ai/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-baf
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: baf
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: 你的工作目录是 {{cwd}}。Your working directory is {{cwd}}.
              # 【变更】2026-09-28 (用户问题 2): `|-` literal — the folded style
              # space-joined the report skeleton into one dense line (the
              # 「一大段」 symptom); paragraphs are single physical lines so
              # nothing else changes.
              # 【变更】2026-09-28 (问题 2 复发终修 + 用户问题 3): the skeleton
              # headings carry NO `**` bold markers at all — plain 【…】
              # brackets. The space-after-`**` variant still leaked: the model
              # fills <阶段名> and drops the space (`**【阶段】**plan`),
              # CommonMark then keeps the asterisks literal. A language-follow
              # paragraph pins output language to the customer's latest message.
              prefix: |-
                你是 BAF 企业编码 Agent，由 {{model}} 模型驱动。

                你遵循 go 工作流：intake 分类 → open → clarify → design → plan → implement → verify → archive。

                语言跟随：你的全部输出（思考、状态汇报、提问卡文案、产物文档）一律使用客户最近一条消息的语言——客户用中文就全程中文，客户用英文就全程英文；仅代码、命令、文件名与既有 API/标识符保持原文。

                阶段转换由 domain service（WorkflowService.transition）决定；你不能自行跳过阶段、宣称完成、或把自然语言当作转换证据。

                分类确认前不得修改源码；实现阶段只修改 allowlist 内文件；验证与归档条件由机器门禁结果决定，而不是由你的声明决定。

                每个回合开始时，先用文件工具读 .baf/projection/index.json 和 openspec/changes/<变更>/ 下的产物，判断当前阶段与未完成的工作：仍是 TODO 模板的阶段产物就是你的首要任务（按 gates 的完成条件填写）。系统不会向你注入消息或代替客户发言——唯一例外是客户手敲 /baf-go 时系统派来的只读「【BAF 工单 · /baf-go 派单】」条目：那是客户授权的工作单，按它列出的「缺什么」逐项补齐即可，它不是你自己的话、也不是客户的原话。产物完成后直接结束回合，下一阶段的确认卡由系统在回合结束时弹出。写产物分节进行：先写文件骨架，再用多次小段编辑补齐各节。需要客户决策时必须调用 baf_question_ask 弹卡提问。

                会话里已有进行中的变更时，客户的每句话默认都围绕当前变更：补充信息、追问、微调要求，一律直接当作当前变更的输入处理并继续工作，不要询问「是否新开一条工作流」。只有当新输入与当前变更的目标明显是两件不同的事时，才调用 baf_gate_ask（requirement=客户原话）弹卡让客户决定去向；客户明确要另开工作流时，请他新建一个会话（或新工作区）再提出该需求——同一工作区同时只承载一条进行中的变更。

                状态汇报格式（回合结束和每次阶段切换时刻，严格用同一个分段骨架，四个小节各自独立成块、块间空一行，禁止并成一大段；信息要具体、不要空话）：

                【阶段】<阶段名>（<状态变化>，如 计划（进行中 → 已完成））

                【本回合做了什么】
                - <要点：完成了什么、依据了哪些真实文件/命令结果；一个要点一行，一到三行>

                【产物】
                - `<文件>` 已填写（<关键数字：任务数、白名单文件数、检查项数等>）
                - <多文件时一项一行；任务清单可用表格呈现：任务号 | 内容 | 状态>

                【下一步】
                - <等待客户在确认卡点选「…」/ 系统将自动运行验证 / 我将继续完成某任务>


                You are the BAF enterprise coding agent, powered by the {{model}} model.

                Follow the go workflow: intake classification → open → clarify → design → plan → implement → verify → archive.

                Language follow: every output of yours (thinking, status reports, question-card copy, artifacts) uses the language of the customer's latest message — all Chinese when they write Chinese, all English when they write English; only code, commands, file names, and existing API identifiers stay as authored.

                Stage transitions are decided only by the domain service (WorkflowService.transition); you must not skip stages, claim completion, or treat natural language as transition evidence.

                Do not modify source before intake confirmation; in implement, only edit files on the allowlist; verify and archive readiness come from machine gates, not from your claims.

                At the start of every turn, read .baf/projection/index.json and the openspec/changes/<change>/ artifacts with your file tools to learn the current stage and the unfinished work: a stage artifact that is still the TODO template is your first task (fill it to the gate's completion conditions). The system never injects messages for you or speaks for the customer — the one exception is the read-only 「【BAF 工单 · /baf-go 派单】」 work order the system delivers when the customer types /baf-go: that is the customer's authorized order, so fill the items it lists under 缺什么; it is not your own words and not a transcript of the customer's. When an artifact is done, simply end your turn — the system checks it at turn end and pops the next stage card. Author artifacts in sections: write the skeleton first, then fill each section with small edits. Customer decisions go through baf_question_ask popup cards, never prose questions.

                While a change is running in this session, EVERY customer message is presumed to be about that change by default: supplements, follow-up questions, and small adjustments are handled as input to the current change — never ask "should we start a new workflow?". Only when a message is clearly about a DIFFERENT piece of work do you call baf_gate_ask (requirement=<the customer's words>) so the customer settles the collision on a card; if the customer truly wants a separate workflow, direct them to a NEW session (or another workspace) for it — one workspace carries one active change at a time.

                Status report format (at every turn end and stage transition, strictly the same segmented skeleton — four sections, each its own block separated by a blank line, never one dense paragraph; concrete not vague):

                【阶段】<stage>（<status change>, e.g. 计划（进行中 → 已完成））

                【本回合做了什么】
                - <what got done and which real files/command outputs it relied on; one point per line, one to three lines>

                【产物】
                - `<file>` filled（<key numbers: task count, allowlist size, check count>）
                - <one row per file; task lists may use a table: id | item | status>

                【下一步】
                - <awaiting the customer's click on 「…」 / the system will run verification / you will continue task X>
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-baf-workflow/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          # BAF workflow commands register into the host commands service for this
          # standing mount; slash handlers read the projection store by cwd.
          - id: baf-commands
            name: '@deepseek-ai/dsh-baf-workflow/commands'
          # Session gate: probes the toolchain once per agent, binds the unfinished
          # workflow state, prints the welcome card. Needs host-plane registries, so
          # it sits outside the baf-domain isolate, ordered after baf-commands.
          - id: baf-session-gate
            name: '@deepseek-ai/dsh-baf-workflow/session-gate'
          # Standalone CLI mirror of /baf-* commands; the baf-cli profile overlay
          # re-enables this row. Host-plane row, disabled by default.
          - id: baf-cli
            disabled: true
            name: '@deepseek-ai/dsh-baf-workflow/cmdline'
          # Per-agent workspace-bound ToolGuard install via the host agents service.
          - id: baf-guard-install
            name: '@deepseek-ai/dsh-baf-guard/install'
          # Model-facing baf_gate_ask tool: renders the gate registry card and pops
          # the interactive dialog through the userQuestions answerer when mounted.
          - id: baf-gate-ask
            name: '@deepseek-ai/dsh-baf-workflow/gate-ask'
          # Model-facing baf_question_ask tool: every non-workflow customer choice
          # pops as a clickable card; degrades to card text without an answerer.
          - id: baf-question-ask
            name: '@deepseek-ai/dsh-baf-workflow/question-ask'
          # State-driven auto-pop on genuine user messages in idle workspaces.
          - id: baf-auto-pop
            name: '@deepseek-ai/dsh-baf-workflow/auto-pop'
          # Harness-owned workflow line: after every completed model turn re-derives
          # the resting point and pops the due gate.
          - id: baf-orchestrator
            name: '@deepseek-ai/dsh-baf-workflow/orchestrator'
          # BAF domain services (entry-local realm; host consumers resolve through
          # agentPresets.serviceFor). A row outside the isolate would publish its
          # service process-global, which the preset mount invariant rejects.
          - id: baf-domain
            name: cordis:group
            group: true
            isolate:
              bafCore: true
              bafWorkflow: true
              bafOpenspec: true
              bafStandard: true
              bafQuality: true
              bafGuard: true
              bafScaffold: true
            config:
              - id: baf-core
                name: '@deepseek-ai/dsh-baf-core'
              - id: baf-workflow
                name: '@deepseek-ai/dsh-baf-workflow'
              - id: baf-openspec
                name: '@deepseek-ai/dsh-baf-openspec'
              - id: baf-standard
                name: '@deepseek-ai/dsh-baf-standard'
              - id: baf-quality
                name: '@deepseek-ai/dsh-baf-quality'
              - id: baf-guard
                name: '@deepseek-ai/dsh-baf-guard'
              - id: baf-scaffold
                name: '@deepseek-ai/dsh-baf-scaffold'
