set noparent
# SORA C — customized cpplint (not Google C++ defaults)
# clang-format owns whitespace/layout; this file owns style/lint that format cannot.
extensions=c,h
linelength=120
root=.

# Exclude third-party / generated / test harness noise (also filtered in baf-quality lint)
exclude_files=third_party
exclude_files=sdk
exclude_files=bsp
exclude_files=vendor
exclude_files=build
exclude_files=test

# Drop checks that fight SORA naming (I2c_Read), clang-format, or C (not C++) practice
filter=-build/c++11
filter=-build/c++14
filter=-build/c++17
filter=-build/c++tr1
filter=-build/header_guard
filter=-build/include_order
filter=-build/include_what_you_use
filter=-build/namespaces
filter=-build/include_alpha
filter=-legal/copyright
filter=-readability/casting
filter=-readability/fn_size
filter=-readability/multiline_comment
filter=-readability/namespace
filter=-readability/nolint
filter=-readability/todo
filter=-readability/alt_tokens
filter=-runtime/references
filter=-runtime/string
filter=-runtime/explicit
filter=-runtime/threadsafe_fn
filter=-runtime/indentation_namespace
filter=-runtime/int
filter=-runtime/arrays
filter=-runtime/printf
filter=-whitespace/indent
filter=-whitespace/braces
filter=-whitespace/line_length
filter=-whitespace/operators
filter=-whitespace/parens
filter=-whitespace/newline
filter=-whitespace/blank_line
filter=-whitespace/ending_newline
filter=-whitespace/end_of_line
filter=-whitespace/tab
filter=-whitespace/comma
filter=-whitespace/comments
filter=-whitespace/semicolon
filter=-whitespace/todo
