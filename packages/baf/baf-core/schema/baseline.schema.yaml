# BAF baseline manifest schema (Phase 0 freeze).
# Concrete tool names and thresholds use <enterprise-tbd> / fixture placeholders.
# Runtime validation in Phase 2 uses zod derived from this contract.

$id: https://deepseek-ai.local/dsh/baf/baseline.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
title: BafBaselineManifest
type: object
additionalProperties: false
required:
  - schema
  - baselineId
  - bafCompatibility
  - workflow
  - routeProfile
  - openspec
  - standard
  - stack
  - guard
properties:
  schema:
    type: integer
    const: 1
  baselineId:
    type: string
    minLength: 1
    pattern: ^[a-z0-9][a-z0-9.-]*$
  bafCompatibility:
    type: object
    additionalProperties: false
    required: [min, max]
    properties:
      min:
        type: string
        minLength: 1
      max:
        type: string
        minLength: 1
  workflow:
    type: object
    additionalProperties: false
    required: [default, requireOpenSpec, bugFixPath]
    properties:
      default:
        type: string
        const: go
      requireOpenSpec:
        type: boolean
      bugFixPath:
        type: object
        additionalProperties: false
        required: [allowed, maxScope, requireRegressionTest]
        properties:
          allowed:
            type: boolean
          maxScope:
            type: string
            enum: [single-file, small-local, cross-module, public-api]
          requireRegressionTest:
            type: boolean
  routeProfile:
    $ref: ./route-profile.schema.json
  openspec:
    type: object
    additionalProperties: false
    required: [cli, version, root, changeRoot, validate]
    properties:
      cli:
        type: string
        minLength: 1
      version:
        type: string
        minLength: 1
      root:
        type: string
        minLength: 1
      changeRoot:
        type: string
        minLength: 1
      validate:
        type: object
        additionalProperties: false
        required: [args]
        properties:
          args:
            type: array
            items:
              type: string
  standard:
    type: object
    additionalProperties: false
    required: [mattPocockRulesRef]
    properties:
      mattPocockRulesRef:
        type: string
        minLength: 1
  stack:
    type: object
    additionalProperties: false
    required: [language, compiler, build, test, coverage, analyzers]
    properties:
      language:
        type: string
        const: c
      compiler:
        type: string
        minLength: 1
      build:
        type: string
        minLength: 1
      test:
        type: string
        minLength: 1
      coverage:
        type: object
        additionalProperties: false
        required: [required, minimum]
        properties:
          required:
            type: boolean
          minimum:
            description: Numeric threshold or enterprise placeholder string.
            oneOf:
              - type: number
                minimum: 0
                maximum: 100
              - type: string
                minLength: 1
      analyzers:
        type: array
        items:
          type: string
          minLength: 1
  guard:
    type: object
    additionalProperties: false
    required: [secretScan, protectedPaths, requireHumanConfirmation]
    properties:
      secretScan:
        type: string
        enum: [required, optional, off]
      protectedPaths:
        type: array
        items:
          type: string
          minLength: 1
      requireHumanConfirmation:
        type: array
        items:
          type: string
          enum: [scaffold, archive, abandon]
  userOverridePolicy:
    description: >
      Enterprise map of which workspace prefs may be customized in the A
      settings surface and override baseline values. Omitted → product defaults
      (bugFixPath allowed/maxScope, coverage.minimum, projectionGitignore,
      verifyNotes, changeSlugPrefix all true).
    type: object
    additionalProperties: false
    required:
      - bugFixPathAllowed
      - bugFixPathMaxScope
      - coverageMinimum
      - projectionGitignore
      - verifyNotes
      - changeSlugPrefix
    properties:
      bugFixPathAllowed:
        type: boolean
      bugFixPathMaxScope:
        type: boolean
      coverageMinimum:
        type: boolean
      projectionGitignore:
        type: boolean
      verifyNotes:
        type: boolean
      changeSlugPrefix:
        type: boolean
  hooks:
    description: >
      [2026-10-19] Per-node custom scripts. enter runs when the workflow
      enters the state (a failure blocks the transition); exit must pass
      before the state may advance forward. Scripts are workspace-relative
      file paths run through the shell (.sh via sh, .ps1 via powershell,
      .js/.mjs/.cjs via node). Omitted block or empty list = no hook; the
      scaffold never writes this block (the settings UI owns it).
    type: object
    additionalProperties: false
    required: [nodes]
    properties:
      nodes:
        type: object
        propertyNames:
          enum: [intake, open, clarify, design, plan, implement, verify, archive, drift]
        additionalProperties: false
        properties:
          intake: &nodeHook
            type: object
            additionalProperties: false
            properties:
              enter: &scriptList
                type: array
                items: { type: string, minLength: 1 }
              exit: *scriptList
          open: *nodeHook
          clarify: *nodeHook
          design: *nodeHook
          plan: *nodeHook
          implement: *nodeHook
          verify: *nodeHook
          archive: *nodeHook
          drift: *nodeHook
